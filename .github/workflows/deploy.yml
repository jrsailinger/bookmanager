# GitHub Pages 自动部署
# ------------------------------------------------------------------
# 每次 push 到 main 分支，自动安装依赖 -> 构建 -> 发布到 GitHub Pages。
# 首次使用后需在仓库 Settings → Pages → Build and deployment → Source
# 选择「GitHub Actions」；之后无需任何手工操作。
#
# 本项目 base 已配置为 './'（相对路径），因此无论仓库被托管在
# https://<user>.github.io/<repo>/ 还是根路径，都能正常加载资源。
name: Deploy to GitHub Pages

on:
  # 同时兼容 main / master 两种默认分支名；这个仓库当前用的是 master
  push:
    branches: [main, master]
  # 允许在 GitHub 网页端手动触发一次构建发布
  workflow_dispatch:

# 最小权限原则
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一次部署，但不取消正在进行的部署（避免发布半成品）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 + 构建
        run: npm run build

      - name: 配置 Pages 环境
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
